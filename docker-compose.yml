services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mcp_control
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp_control"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://mcp:mcp_secret@postgres:5432/mcp_control
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-B2d8zbySL4aG5LeprF4bM9x1qn0FB7t7V66_AHKXHGQ=}
      SIPP_MCP_URL: http://host.docker.internal:9090/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  sipp-stress:
    build: ./sipp-stress
    network_mode: host
    environment:
      MCP_PORT: 9090
    volumes:
      - sipp-results:/tmp/sipp

  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  sipp-results:
